name: Site checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      redirect_mappings:
        description: HTTP-to-HTTPS origin mappings separated by spaces
        required: true
        default: http://wcashwallet.com=https://wcashwallet.com http://www.wcashwallet.com=https://wcashwallet.com

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm test

  deployed-http-redirect:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Assert HTTP never serves wallet HTML
        env:
          REDIRECT_MAPPINGS: ${{ inputs.redirect_mappings }}
        run: node scripts/check-http-redirect.mjs
